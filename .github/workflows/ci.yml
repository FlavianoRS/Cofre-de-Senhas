name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências imutáveis
        run: yarn install --immutable

      - name: Validar TypeScript
        run: yarn typecheck
